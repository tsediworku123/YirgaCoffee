    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Yirga Coffee",
          "url": "https://yirgacoffee.com",
          "logo": "https://yirgacoffee.com/logo.svg",
          "description": "Premium Ethiopian coffee sourced directly from family farms in Yirgacheffe, Sidamo, Harrar, and Limu.",
          "foundingDate": "2020",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Europaweg 830",
            "addressLocality": "Rotterdam",
            "postalCode": "3199 LD",
            "addressCountry": "NL"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+31-10-234-5678",
            "contactType": "customer service",
            "email": "info@yirgacoffee.com"
          }
        },
        {
          "@type": "WebSite",
          "name": "Yirga Coffee",
          "url": "https://yirgacoffee.com",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://yirgacoffee.com/shop?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Store",
          "name": "Yirga Coffee",
          "url": "https://yirgacoffee.com/shop",
          "priceRange": "$21.99-$34.99",
          "acceptsPayments": ["CreditCard", "DebitCard"],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Ethiopian Coffee Beans",
            "itemListElement": [
              {
                "@type": "Offer",
                "itemOffered": {
                  "@type": "Product",
                  "name": "Yirgacheffe Light Roast",
                  "description": "Bright, complex, intensely aromatic single-origin coffee",
                  "image": "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=500&q=80"
                },
                "price": "24.99",
                "priceCurrency": "USD"
              }
            ]
          }
        }
      ]
    }
    </script>
